<title>Для Айсанат</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600&family=Marck+Script&display=swap">
<style>
/* Layout: ночное небо с луной (Ай — «луна» по-кыргызски), имя крупно в центре, ниже письмо и причины одной колонкой */
:root {
  --bg: #fbf1f3;
  --surface: #fff9fa;
  --fg: #3b2235;
  --muted: #7e6477;
  --accent: #b8405f;
  --gold: #a9792f;
  --line: rgba(59, 34, 53, 0.16);
  --moon-a: #fff4d6;
  --moon-b: #f1d9a5;
  --glow: rgba(214, 150, 120, 0.35);
  --star: 169, 121, 47;
  --f-display: "Cormorant Garamond", "Georgia", serif;
  --f-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-script: "Marck Script", "Segoe Script", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c1128; --surface: #291a38; --fg: #f6e8ee; --muted: #bba5b6;
    --accent: #f292ac; --gold: #e6c68e; --line: rgba(246, 232, 238, 0.18);
    --moon-a: #fff6dc; --moon-b: #efd8a6; --glow: rgba(242, 146, 172, 0.28);
    --star: 230, 198, 142;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1c1128; --surface: #291a38; --fg: #f6e8ee; --muted: #bba5b6;
  --accent: #f292ac; --gold: #e6c68e; --line: rgba(246, 232, 238, 0.18);
  --moon-a: #fff6dc; --moon-b: #efd8a6; --glow: rgba(242, 146, 172, 0.28);
  --star: 230, 198, 142;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--f-body);
  font-size: 17px;
  line-height: 1.7;
  padding-block: 0 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  position: relative;
  overflow-x: hidden;
}
#sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
main { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; }

.hero { padding: 72px 0 48px; text-align: center; }
.moon {
  width: 132px; height: 132px; margin: 0 auto 36px; border-radius: 50%;
  background: radial-gradient(circle at 36% 32%, var(--moon-a), var(--moon-b) 70%);
  box-shadow: 0 0 0 14px var(--glow), 0 0 80px 24px var(--glow);
  position: relative; overflow: hidden;
}
.moon::after {
  content: ""; position: absolute; width: 112px; height: 112px; border-radius: 50%;
  top: -14px; right: -42px; background: var(--bg);
}
.kicker { font-size: 13px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); margin: 0 0 12px; }
h1 {
  font-family: var(--f-display); font-style: italic; font-weight: 600;
  font-size: clamp(56px, 18vw, 104px); line-height: 1; margin: 0 0 18px;
  color: var(--fg); text-wrap: balance;
}
.lead { font-family: var(--f-script); font-size: clamp(24px, 6vw, 30px); color: var(--accent); margin: 0 auto; max-width: 18em; line-height: 1.35; }

section { padding: 40px 0; border-top: 1px solid var(--line); }
h2 { font-family: var(--f-display); font-weight: 600; font-size: 34px; line-height: 1.15; margin: 0 0 20px; text-wrap: balance; }
.letter p { margin: 0 0 1.1em; max-width: 34em; }
.letter .sign { font-family: var(--f-script); font-size: 28px; color: var(--accent); margin: 8px 0 0; }

.reasons { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.reasons li { padding: 18px 0; border-bottom: 1px solid var(--line); display: grid; gap: 4px; }
.reasons li:first-child { padding-top: 0; }
.reasons li:last-child { border-bottom: 0; }
.reasons b { font-family: var(--f-display); font-size: 24px; font-weight: 600; font-style: italic; color: var(--accent); }
.reasons span { color: var(--muted); }

.heart-zone { text-align: center; }
.heart-zone p { color: var(--muted); margin: 0 0 20px; }
button.love {
  font: inherit; font-weight: 600; font-size: 16px; cursor: pointer;
  color: var(--bg); background: var(--accent); border: 0; border-radius: 999px;
  padding: 14px 28px; min-height: 48px;
  transition: transform 0.15s ease;
}
button.love:hover { transform: translateY(-2px); }
button.love:active { transform: scale(0.97); }
button.love:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.count { display: block; margin-top: 14px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; min-height: 1.5em; }

footer { padding-top: 40px; text-align: center; font-family: var(--f-script); font-size: 26px; color: var(--accent); border-top: 1px solid var(--line); }

.fly {
  position: fixed; z-index: 5; pointer-events: none; color: var(--accent);
  font-size: 26px; line-height: 1; animation: rise 2.4s ease-out forwards;
}
@keyframes rise {
  0% { transform: translate(0, 0) scale(0.6); opacity: 0; }
  15% { opacity: 1; }
  100% { transform: translate(var(--dx), -42vh) scale(1.3); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .fly { animation: none; display: none; }
  html { scroll-behavior: auto; }
  button.love { transition: none; }
}

.hero { padding-bottom: 24px; }
.dedication { text-align: center; }
.dedication .words {
  font-family: var(--f-display); font-style: italic; font-weight: 500;
  font-size: clamp(26px, 6.6vw, 38px); line-height: 1.4; margin: 0 auto 24px;
  max-width: 20em; text-wrap: balance;
}
.dedication em { font-style: normal; font-weight: 600; color: var(--accent); letter-spacing: 0.04em; }
.dedication .to { font-family: var(--f-script); font-size: 32px; color: var(--accent); margin: 0; }
.heart-zone { border-top: 0; padding-top: 8px; }
button.love.round { width: 64px; height: 64px; padding: 0; font-size: 28px; line-height: 1; }
</style>

<canvas id="sky" aria-hidden="true"></canvas>
<main>
  <header class="hero">
    <div class="moon" aria-hidden="true"></div>
    <h1>Айсанат</h1>
  </header>

  <section class="dedication">
    <p class="words">Сүйгөн, жактырган, оюмду алган, көргөндө жылуулукту сездирген, мени өтө <em>СЫЙЛАП</em> көңүлүмдү түшүрбөй жүргөн кызыма арнайм</p>
    <p class="to">— Айсанат ♥</p>
  </section>

  <section class="heart-zone">
    <button class="love round" id="love" type="button" aria-label="Сердечки">♥</button>
  </section>
</main>

<script>
(function () {
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var cv = document.getElementById("sky"), ctx = cv.getContext("2d"), stars = [], W = 0, H = 0, t = 0;

  function resize() {
    var r = window.devicePixelRatio || 1;
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * r; cv.height = H * r;
    ctx.setTransform(r, 0, 0, r, 0, 0);
    var n = Math.round(W * H / 9000);
    stars = [];
    for (var i = 0; i < n; i++) {
      stars.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.4 + 0.4, p: Math.random() * 6.28, s: Math.random() * 0.02 + 0.006 });
    }
    draw();
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    var rgb = getComputedStyle(document.documentElement).getPropertyValue("--star").trim() || "230,198,142";
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i], a = 0.25 + 0.45 * (0.5 + 0.5 * Math.sin(s.p + t * s.s * 60));
      ctx.fillStyle = "rgba(" + rgb + "," + a.toFixed(3) + ")";
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.2832); ctx.fill();
    }
  }
  function loop() { t += 1 / 60; draw(); requestAnimationFrame(loop); }
  window.addEventListener("resize", resize);
  resize();
  if (!reduce) requestAnimationFrame(loop);

  var btn = document.getElementById("love"), out = document.getElementById("count"), n = 0;
  var phrases = ["Я знал, что ты улыбнёшься", "Ты лучшая", "Это всё для тебя", "Ты самая красивая", "Ты моя луна"];
  btn.addEventListener("click", function () {
    n++;
    if (reduce) return;
    var r = btn.getBoundingClientRect();
    for (var i = 0; i < 7; i++) {
      var h = document.createElement("span");
      h.className = "fly"; h.textContent = "♥";
      h.style.left = (r.left + r.width / 2 + (Math.random() * 80 - 40)) + "px";
      h.style.top = (r.top + 10) + "px";
      h.style.setProperty("--dx", (Math.random() * 120 - 60) + "px");
      h.style.animationDelay = (i * 0.07) + "s";
      document.body.appendChild(h);
      setTimeout((function (el) { return function () { el.remove(); }; })(h), 2800);
    }
  });
})();
</script>
